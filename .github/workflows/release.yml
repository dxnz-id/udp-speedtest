name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: tar.gz
            musl: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
            cross: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: zip
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross gcc
        if: matrix.cross == 'aarch64-linux-gnu-gcc'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: rustup target add ${{ matrix.target }}
      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - shell: bash
        run: |
          bin=udp-speedtest
          [ "${{ runner.os }}" = "Windows" ] && bin=udp-speedtest.exe
          mkdir pkg
          cp "target/${{ matrix.target }}/release/$bin" pkg/
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a "udp-speedtest-${{ matrix.target }}.zip" pkg/*
          else
            tar czf "udp-speedtest-${{ matrix.target }}.tar.gz" -C pkg .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: udp-speedtest-${{ matrix.target }}
          path: udp-speedtest-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
